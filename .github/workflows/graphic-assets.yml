name: Asset catalogue and public theme guard
# CI-safe policy: no automatic PR/sync or feature-branch push runs.
on:
  push:
    branches:
      - main
    paths:
      - 'tools/audit-graphic-assets.mjs'
      - 'tools/prepare-private-historical.mjs'
      - 'tools/perceptual-duplicates.py'
      - 'tools/tests/**'
      - 'tools/ci/check_asset_boundaries.py'
      - 'apps/web/lib/assets/**'
      - 'apps/web/public/**'
      - '.dockerignore'
      - '.github/workflows/graphic-assets.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit test with temporary fake corpus
        run: node --test tools/tests/asset-audit.test.mjs
      - name: Validate opt-in local pack preparation with synthetic fixtures
        run: node --test tools/tests/prepare-private-historical.test.mjs
      - name: Audit real tracked corpus in ignored workspace only
        run: node tools/audit-graphic-assets.mjs
      - name: Scan visual near-duplicates (metadata only)
        run: |
          python3 -m pip install --quiet Pillow
          python3 -m unittest discover -s tools/tests -p 'test_perceptual.py' -v
          python3 tools/perceptual-duplicates.py
      - name: Reject non-whitelisted public theme material
        run: python3 tools/ci/check_asset_boundaries.py
