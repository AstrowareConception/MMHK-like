name: PvE consistency / frozen-input quality gate
# Lightweight PR gate plus the full production-like main workflow.
# A passing test is NOT acceptance of the historical gameplay US.
on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/api/src/mmhk_api/pve_*.py'
      - 'apps/api/src/mmhk_api/sql/10[0-9]_*.sql'
      - 'apps/api/tests/test_pve_*.py'
      - 'apps/web/**'
      - 'tools/e2e/local_browser.py'
      - 'data/backlog/**'
      - 'docs/backlog/**'
      - '.github/workflows/pve-quality-gate.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: pve-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pve-postgresql-and-replay:
    name: PvE snapshots / PostgreSQL / deterministic replay
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mmhk
          POSTGRES_PASSWORD: mmhk_ci_only
          POSTGRES_DB: mmhk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mmhk -d mmhk_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MMHK_DATABASE_URL: postgresql://mmhk:mmhk_ci_only@localhost:5432/mmhk_test
      MMHK_TEST_DATABASE_URL: postgresql://mmhk:mmhk_ci_only@localhost:5432/mmhk_test
      MMHK_LOGIN_RATE_KEY: ci-pve-quality-hmac-key-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Python project dependencies
        run: python -m pip install -e './apps/api[dev]'
      - name: Compile changed Python modules and test fixtures
        run: |
          python -m py_compile \
            apps/api/src/mmhk_api/pve_encounter_snapshot.py \
            apps/api/src/mmhk_api/pve_ordinary_line_snapshot.py \
            apps/api/src/mmhk_api/pve_missions.py \
            apps/api/tests/test_pve_encounter_snapshot.py \
            apps/api/tests/test_pve_ordinary_line_snapshot.py \
            apps/api/tests/test_pve_mission_flight.py \
            apps/api/tests/test_pve_missions_integration.py \
            tools/e2e/local_browser.py
      - name: Apply actual PostgreSQL migrations, including V100
        run: python -m mmhk_api.manage migrate
      - name: Test frozen opponents, legacy missions, and API worker replay
        run: |
          python -m pytest -q \
            apps/api/tests/test_pve_encounter_snapshot.py \
            apps/api/tests/test_pve_mission_flight.py \
            apps/api/tests/test_pve_missions_integration.py
      - name: Verify full Python regression suite
        run: python -m pytest -q apps/api/tests
      - name: Validate all 300 US are still tracked
        run: node tools/validate-implementation-review.mjs

  web-types:
    name: Next.js build / strict TS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm run typecheck
