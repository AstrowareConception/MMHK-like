name: FastAPI + Next.js foundation
on:
  push:
    paths:
      - 'apps/**'
      - 'tools/jactari-port/core.mjs'
      - 'tools/jactari-port/python-duel-oracle.mjs'
      - '.github/workflows/fullstack-foundation.yml'
      - 'compose.dev.yaml'
      - 'compose.workers.yaml'
      - 'compose.preview.yaml'
      - '.dockerignore'
      - 'tools/ci/check_private_preview.py'
      - 'compose.local.yaml'
      - '.env.local.example'
      - 'tools/local/**'
      - 'tools/ci/check_local_stack.py'
      - 'tools/e2e/**'
  pull_request:
    paths:
      - 'apps/**'
      - 'tools/jactari-port/core.mjs'
      - 'tools/jactari-port/python-duel-oracle.mjs'
      - '.github/workflows/fullstack-foundation.yml'
      - 'compose.dev.yaml'
      - 'compose.workers.yaml'
      - 'compose.preview.yaml'
      - '.dockerignore'
      - 'tools/ci/check_private_preview.py'
      - 'compose.local.yaml'
      - '.env.local.example'
      - 'tools/local/**'
      - 'tools/ci/check_local_stack.py'
      - 'tools/e2e/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api-python-and-js-oracle:
    name: FastAPI contract and Python/JS Jactari differential
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mmhk
          POSTGRES_PASSWORD: mmhk_ci_only
          POSTGRES_DB: mmhk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mmhk -d mmhk_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MMHK_DATABASE_URL: postgresql://mmhk:mmhk_ci_only@localhost:5432/mmhk_test
      MMHK_TEST_DATABASE_URL: postgresql://mmhk:mmhk_ci_only@localhost:5432/mmhk_test
      MMHK_LOGIN_RATE_KEY: this-is-a-ci-only-random-like-32-character-test-secret-123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install API and test dependencies
        run: python -m pip install -e './apps/api[dev]'
      - name: Verify Python Jactari and PostgreSQL world/session isolation
        run: python -m pytest -q apps/api/tests
      - name: Validate opt-in worker Compose configuration
        env:
          MMHK_POSTGRES_PASSWORD: ci_only_password
        run: docker compose -f compose.dev.yaml -f compose.workers.yaml --profile workers config --quiet
      - name: Build unprivileged worker container
        run: docker build -f apps/api/Dockerfile.worker -t mmhk-worker-ci .
      - name: Verify worker CLI boots without database
        run: docker run --rm mmhk-worker-ci python -m mmhk_api.supervised_worker --help

  next-build:
    name: Next.js production build and strict TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned top-level dependencies
        run: npm install --no-audit --no-fund
      - name: Build frontend without a running API
        run: npm run build
      - name: Check frontend types
        run: npm run typecheck

  private-preview-build:
    name: Check SSH-only preview ports and build API/Next images
    runs-on: ubuntu-latest
    env:
      MMHK_PREVIEW_POSTGRES_PASSWORD: ci-only-preview-database-password
      MMHK_LOGIN_RATE_KEY: ci-only-preview-hmac-key-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - name: Assert preview services are never exposed beyond localhost
        run: python tools/ci/check_private_preview.py
      - name: Build private FastAPI and Next.js preview images
        run: docker compose -f compose.preview.yaml build api web
      - name: Start isolated PostgreSQL and apply actual migrations
        run: |
          docker compose -f compose.preview.yaml up -d postgres redis
          docker compose -f compose.preview.yaml run --rm api python -m mmhk_api.manage migrate
      - name: Smoke test private Next.js to internal FastAPI connection
        run: |
          docker compose -f compose.preview.yaml up -d api web
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3001/ 2>/dev/null | grep -q 'API FastAPI joignable'; then
              echo "Private end-to-end app reachable on localhost only"
              exit 0
            fi
            sleep 2
          done
          docker compose -f compose.preview.yaml ps
          docker compose -f compose.preview.yaml logs --tail=60 api web
          exit 1
      - name: Remove disposable CI preview database and containers
        if: always()
        run: docker compose -f compose.preview.yaml down --volumes --remove-orphans

  local-six-service-smoke:
    name: Build and start six-service localhost stack with a real demo
    # Playwright 1.56 Chromium supports Noble, not the runner's newer Ubuntu 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Assert local-only network and automatic migrations
        run: python3 tools/ci/check_local_stack.py
      - name: Start all local services with generated ephemeral secrets
        run: python3 tools/local/stack.py up
      - name: Verify worker health and all services
        run: |
          docker compose --env-file .env.local -f compose.local.yaml ps --all
          docker compose --env-file .env.local -f compose.local.yaml exec -T worker \
            python -m mmhk_api.supervised_worker --check-health
      - name: Install headless Chromium for real user-journey testing
        run: |
          python3 -m pip install --quiet playwright==1.56.0
          python3 -m playwright install --with-deps chromium
      - name: Provision experimental playable sandbox and verify authenticated HTTP
        run: |
          output="$(python3 tools/local/stack.py demo --username demo_ci)"
          password="$(printf '%s\n' "$output" | sed -n 's/^One-time generated password: //p')"
          test ${#password} -ge 16
          docker compose --env-file .env.local -f compose.local.yaml exec -T \
            -e "MMHK_CI_DEMO_PASSWORD=$password" api python - <<'PY'
          import json, os, urllib.request
          def request(path, token=None, payload=None):
              headers={"Content-Type":"application/json"}
              if token:
                  headers["Authorization"]="Bearer "+token
              data=json.dumps(payload).encode() if payload is not None else None
              result=urllib.request.urlopen(
                  urllib.request.Request(
                      "http://127.0.0.1:8000"+path,
                      data=data,headers=headers,method="POST" if data else "GET",
                  ),timeout=8)
              return json.load(result)
          authenticated=request("/api/v1/sessions",payload={
              "username":"demo_ci",
              "password":os.environ["MMHK_CI_DEMO_PASSWORD"],
          })
          token=authenticated["access_token"]
          worlds=request("/api/v1/me/worlds",token)
          assert len(worlds)==1 and worlds[0]["world_id"]=="local-sandbox",worlds
          cities=request("/api/v1/me/worlds/local-sandbox/cities",token)
          assert len(cities)==1,cities
          city=request("/api/v1/me/cities/"+cities[0]["city_id"],token)
          assert city["stocks"]["gold"]>=120,city
          assert city["production_active"] is True,city
          catalog=request("/api/v1/me/cities/"+cities[0]["city_id"]+"/construction",token)
          assert any(row["building_code"]=="village_hall" for row in catalog["options"]),catalog
          print("Authenticated local sandbox OK: world, resources, production, construction")
          PY
          curl --fail --silent --show-error http://127.0.0.1:3000/ | grep -q 'API FastAPI joignable'
          echo "Browser-to-API and sandbox login verified"
          MMHK_E2E_URL="http://127.0.0.1:3000" \
          MMHK_E2E_USERNAME="demo_ci" \
          MMHK_E2E_PASSWORD="$password" \
          python3 tools/e2e/local_browser.py
      - name: Verify local PostgreSQL backup is readable
        run: |
          python3 tools/local/stack.py backup
          file="$(find backups -maxdepth 1 -type f -name 'mmhk-local-*.dump' -print -quit)"
          test -s "$file"
          docker compose --env-file .env.local -f compose.local.yaml exec -T \
            postgres pg_restore --list < "$file" > /dev/null
          echo "Local pg_dump backup archive verified"
      - name: Stop disposable stack and destroy its CI volume
        if: always()
        run: |
          if [ -f .env.local ]; then
            docker compose --env-file .env.local -f compose.local.yaml down -v --remove-orphans
            rm -f .env.local
          fi
