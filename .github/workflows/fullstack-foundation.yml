name: FastAPI + Next.js foundation
on:
  push:
    paths:
      - 'apps/**'
      - 'tools/jactari-port/core.mjs'
      - 'tools/jactari-port/python-duel-oracle.mjs'
      - '.github/workflows/fullstack-foundation.yml'
  pull_request:
    paths:
      - 'apps/**'
      - 'tools/jactari-port/core.mjs'
      - 'tools/jactari-port/python-duel-oracle.mjs'
      - '.github/workflows/fullstack-foundation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api-python-and-js-oracle:
    name: FastAPI contract and Python/JS Jactari differential
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mmhk
          POSTGRES_PASSWORD: mmhk_ci_only
          POSTGRES_DB: mmhk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mmhk -d mmhk_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MMHK_DATABASE_URL: postgresql://mmhk:mmhk_ci_only@localhost:5432/mmhk_test
      MMHK_TEST_DATABASE_URL: postgresql://mmhk:mmhk_ci_only@localhost:5432/mmhk_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install API and test dependencies
        run: python -m pip install -e './apps/api[dev]'
      - name: Verify Python Jactari and PostgreSQL world/session isolation
        run: python -m pytest -q apps/api/tests

  next-build:
    name: Next.js production build and strict TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned top-level dependencies
        run: npm install --no-audit --no-fund
      - name: Build frontend without a running API
        run: npm run build
      - name: Check frontend types
        run: npm run typecheck
