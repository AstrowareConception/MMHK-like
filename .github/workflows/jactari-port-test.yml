name: Jactari port regression
on:
  push:
    paths:
      - 'tools/jactari-port/**'
      - 'data/Jactari/src/scripts/combat.min.js'
      - '.github/workflows/jactari-port-test.yml'
  pull_request:
    paths:
      - 'tools/jactari-port/**'
      - 'data/Jactari/src/scripts/combat.min.js'
      - '.github/workflows/jactari-port-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run isolated Jactari module tests
        run: node --test tools/jactari-port/*.test.mjs
