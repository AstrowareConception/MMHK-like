name: Jactari port regression
# Run once after merge to main; manual validation on a consolidated feature branch.
on:
  push:
    branches: [main]
    paths:
      - 'tools/jactari-port/**'
      - 'data/Jactari/src/scripts/combat.min.js'
      - 'data/Jactari/src/scripts/donnees.*.min.js'
      - 'data/analysis/jactari-combat-conformance-roadmap.json'
      - 'docs/game-design/32-ROADMAP-CONFORMITE-MOTEUR-COMBAT.md'
      - '.github/workflows/jactari-port-test.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run isolated Jactari module tests
        run: node --test tools/jactari-port/*.test.mjs
