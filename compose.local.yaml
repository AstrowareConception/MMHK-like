# MMHK-like complete LOCAL Docker stack. Not for public deployment.
# Start: python3 tools/local/stack.py up
# The helper generates .env.local with random secrets; NEVER commit that file.
name: mmhk-local
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mmhk_local
      POSTGRES_PASSWORD: ${MMHK_LOCAL_POSTGRES_PASSWORD:?Run python3 tools/local/stack.py init}
      POSTGRES_DB: mmhk_local
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmhk_local -d mmhk_local"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s
    networks: [backend]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no",
              "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend]
    restart: unless-stopped
    # Redis is ready for caching but not yet wired to game-state logic.

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.api
    command: ["python", "-m", "mmhk_api.manage", "migrate"]
    environment: &pg_connection
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: mmhk_local
      PGUSER: mmhk_local
      PGPASSWORD: ${MMHK_LOCAL_POSTGRES_PASSWORD:?Run python3 tools/local/stack.py init}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]
    restart: "no"
    security_opt: ["no-new-privileges:true"]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.api
    environment:
      <<: *pg_connection
      MMHK_LOGIN_RATE_KEY: ${MMHK_LOGIN_RATE_KEY:?Run python3 tools/local/stack.py init}
      # Only the locally bound API management container may seed a sandbox.
      MMHK_LOCAL_DEMO_ENABLED: "true"
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s
    networks: [backend]
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    security_opt: ["no-new-privileges:true"]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.preview
    environment:
      NODE_ENV: production
      MMHK_API_INTERNAL_URL: http://api:8000
      MMHK_PREVIEW_LOOPBACK_ONLY: "true"
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${MMHK_LOCAL_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 30s
    # Separate port-publishing bridge. PostgreSQL/API/Redis/worker
    # only connect to internal backend; only web can reach the host bridge.
    networks: [backend, edge]
    restart: unless-stopped
    read_only: true
    tmpfs:
      - "/tmp:size=32m,mode=1777"
      - "/opt/web/.next/cache:size=64m,mode=1777"
    security_opt: ["no-new-privileges:true"]

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.worker
    environment:
      <<: *pg_connection
    command: ["python", "-m", "mmhk_api.supervised_worker", "--loop",
              "--interval-seconds", "10", "--max-cities", "25",
              "--max-orders", "25", "--max-ticks-per-city", "96"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "mmhk_api.supervised_worker",
             "--check-health", "--max-age-seconds", "90"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 45s
    networks: [backend]
    restart: unless-stopped
    stop_grace_period: 40s
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    security_opt: ["no-new-privileges:true"]

networks:
  backend:
    driver: bridge
    internal: true
  edge:
    driver: bridge

volumes:
  postgres_data:
