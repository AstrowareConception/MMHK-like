# Local development support only. No public API or game workers are launched.
# Required environment: MMHK_POSTGRES_PASSWORD (keep outside Git).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mmhk
      POSTGRES_PASSWORD: ${MMHK_POSTGRES_PASSWORD:?Set MMHK_POSTGRES_PASSWORD}
      POSTGRES_DB: mmhk
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - mmhk_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmhk -d mmhk"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no", "--maxmemory", "128mb",
              "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  mmhk_pg_data:
