# Optional worker, not started by default: docker compose --profile workers up -d.
# Requires PostgreSQL migrations through V005 to be applied by an operator.
services:
  supervised-worker:
    profiles: ["workers"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile.worker
    environment:
      MMHK_DATABASE_URL: postgresql://mmhk:${MMHK_POSTGRES_PASSWORD:?Set MMHK_POSTGRES_PASSWORD}@postgres:5432/mmhk
      # Each instance MUST have a unique identity; default uses container hostname.
    command:
      - python
      - -m
      - mmhk_api.supervised_worker
      - --loop
      - --interval-seconds
      - "10"
      - --max-cities
      - "25"
      - --max-orders
      - "25"
      - --max-ticks-per-city
      - "96"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 40s
    healthcheck:
      test: ["CMD", "python", "-m", "mmhk_api.supervised_worker", "--check-health", "--max-age-seconds", "90"]
      start_period: 45s
      interval: 30s
      timeout: 8s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
